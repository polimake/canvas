name: Excalidraw (Polimake)

# Compila Excalidraw desde vendor/excalidraw (el original + nuestros parches) y
# lo publica como Release descargable. Desktop y Studio lo instalan desde ahí:
#   "@excalidraw/excalidraw": "https://github.com/polimake/canvas/releases/download/excalidraw-v<versión>/excalidraw-excalidraw-<versión>.tgz"
#
# Se dispara con una etiqueta excalidraw-v<versión>, que tiene que coincidir con
# la versión que da scripts/excalidraw.mjs (<versión>-g<base>.polimake.N). Va aparte de
# distribute.yml: sus etiquetas son v* y las de aquí no empiezan por v.

on:
  push:
    tags: ['excalidraw-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Su monorepo pide node 18–22.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
      - name: Compilar desde el fuente
        run: node scripts/excalidraw.mjs --instalar
      - name: Comprobar la etiqueta
        id: paquete
        run: |
          read -r version etiqueta < <(node scripts/excalidraw.mjs --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$etiqueta" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con $etiqueta" >&2
            exit 1
          fi
          cd vendor/excalidraw-dist && sha256sum *.tgz > SHA256SUMS && ls -l
      - name: Publicar el Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.paquete.outputs.version }}
        run: |
          base=$(node -p "require('./vendor/excalidraw-dist/paquetes.json').base")
          {
            echo "Excalidraw $VERSION: su rama principal (excalidraw/excalidraw@$base) con los parches de Polimake, compilado desde \`vendor/excalidraw\`."
            echo
            echo "Para el lienzo basta \`@excalidraw/excalidraw\`; los demás paquetes los pide él por su URL:"
            echo
            echo "\`\`\`json"
            node -p "JSON.stringify(require('./vendor/excalidraw-dist/paquetes.json').paquetes, null, 2)"
            echo "\`\`\`"
            echo
            echo "Licencia MIT, la del original (incluida en cada paquete). Parches: \`vendor/EXCALIDRAW.md\`."
          } > notas.md
          gh release create "$GITHUB_REF_NAME" vendor/excalidraw-dist/*.tgz vendor/excalidraw-dist/SHA256SUMS vendor/excalidraw-dist/paquetes.json --repo "$GITHUB_REPOSITORY" --title "Excalidraw $VERSION (Polimake)" --notes-file notas.md
