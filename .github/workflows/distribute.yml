name: Build and distribute Canvas

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
      stable: ${{ steps.package.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Always compile source; never distribute a stale committed dist/.
      - run: pnpm build
      - run: pnpm verify:build
      - name: Package versioned distribution
        id: package
        run: pnpm release:package
      - name: Install and bundle as external consumers with React 18 and 19
        run: pnpm verify:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canvas-package
          path: artifacts
      - name: Publish installable package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          STABLE: ${{ needs.build.outputs.stable }}
        shell: bash
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          flags=(--prerelease --latest=false --target "$GITHUB_SHA")
          if [ "$STABLE" = "true" ]; then
            flags=(--verify-tag)
          fi
          # No --clobber: a published version is never silently replaced.
          gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS release.json \
            --title "@pm/canvas $RELEASE_VERSION" --notes-file release.md "${flags[@]}"
          cat release.md >> "$GITHUB_STEP_SUMMARY"
